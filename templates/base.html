<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FitFuture Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    {% block head_extras %}{% endblock %}
</head>
<body class="view-{{ active_view|default('workouts') }}">
<div class="shell">
    <header class="topbar">
        <div class="header-inner">
            <div class="brand">
                <div class="brand-logo">
                    <div class="brand-logo-inner">FF</div>
                </div>
                <div class="brand-text">
                    <div class="brand-title">FitFuture</div>
                    <div class="brand-subtitle">Training intelligence dashboard</div>
                </div>
            </div>
            <div class="topbar-actions">
                <span class="status-pill">
                    <span class="status-dot"></span>
                    Portfolio build
                </span>
            </div>
        </div>
        <div class="nav-tabs">
            <a
                href="{{ url_for('index') }}"
                class="nav-tab {% if active_view == 'workouts' %}nav-tab-active{% endif %}"
            >
                <span class="nav-icon">01</span>
                Workouts
            </a>
            <a
                href="{{ url_for('analytics') }}"
                class="nav-tab {% if active_view == 'analytics' %}nav-tab-active{% endif %}"
            >
                <span class="nav-icon">02</span>
                Analytics
            </a>
        </div>
    </header>

    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>
</div>

{% block scripts %}{% endblock %}
</body>
</html>
